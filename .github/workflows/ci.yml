name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify

      # The documented commands, run as written. Three defects have come from
      # the docs promising something the CLI did not do.
      - run: npm run test:docs

      # What npm would publish, installed into a project with no workspace to
      # fall back on. Five releases of the engine could not be imported at all.
      - run: npm run test:pack
      - run: npm run check:versions

      # The proxy as a process on a socket, which is where a client hanging up
      # mid-request used to kill it outright.
      - run: npm run test:proxy

      # The content script against the DOM shapes the supported sites use.
      # Needs a real browser: the failure this guards against is invisible to
      # a simulated DOM, which agreed with the implementation about what a
      # composer looks like while multi-line prompts went unscanned.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dom

      # axe-core on the popup, the settings page and the in-page indicator, both colour
      # schemes and three widths, plus keyboard use and announcements axe has no rule for.
      - run: npm run test:a11y --workspace @sbr0nch/contextia-extension
      # Every screen in its states (empty, with activity, storage failing, blocked, too long) at phone and desktop widths.
      - run: npm run test:states --workspace @sbr0nch/contextia-extension
      # The same extension installed in the runner's real Firefox, driven with real key presses.
      - run: npm run test:firefox --workspace @sbr0nch/contextia-extension
        env:
          REQUIRE_FIREFOX: '1'
